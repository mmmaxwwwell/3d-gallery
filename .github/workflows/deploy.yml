name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Leaves room for the time-boxed print-estimate step on a cold cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Run the build under the same Nix devshell used locally. This
      # pins openscad-unstable (which ships the Manifold engine — 40x
      # faster than the apt-shipped stable openscad, and the only path
      # supporting `--backend Manifold`), plus BOSL2 / qr.scad via the
      # Nix profile, so CI and local produce identical artifacts.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Public binary cache for Nix builds — first-time devshell setup
      # falls back to nixpkgs cache instead of building from source.
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Content-addressed openscad artifact cache. Hits when nothing
      # about the model source (or the openscad version pinned by
      # flake.lock, or the build scripts) has changed. On a hit, the
      # rebuild is a few file copies.
      # Print estimates ride along: they're keyed by artifact key + slice
      # settings, so a restored entry is only ever reused for identical input.
      - name: Cache openscad build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .cache/forge
            .cache/print-estimates
          # Unique per run so the cache is always saved: a time-boxed estimate
          # run keeps what it finished, and the next deploy picks up from there.
          key: forge-cache-${{ hashFiles('models/**/*.scad', 'scripts/estimate-prints.mjs') }}-${{ github.run_id }}
          restore-keys: |
            forge-cache-${{ hashFiles('models/**/*.scad', 'scripts/estimate-prints.mjs') }}-
            forge-cache-

      - name: Install node dependencies
        run: nix develop --command npm ci

      - name: Build models (OpenSCAD → STL / 3MF)
        run: nix develop --command npm run build:models

      # Guard against silent shape regressions before we ship. Fast
      # (<1s) because it just re-parses the artifacts we just built.
      - name: Verify build fingerprints
        run: nix develop --command npm run test:build

      # npm ci skips the toolkit's postinstall under CI, so fetch the slicer here.
      # Not a gate: without a slicer release the site ships without print
      # estimates or in-browser slicing rather than not shipping at all.
      - name: Fetch slicer WASM
        run: nix develop --command npm run fetch-wasm -w @3d-gallery/print-toolkit -- --no-wasm64
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Slice every printable part at 3 / 8 / 12 / 18 mm³/s for the gallery's
      # print-time estimates. Information, not a gate: a part that won't slice
      # warns, and a cold cache that runs out of time ships without estimates
      # (each finished part is cached, so the next deploy resumes).
      - name: Estimate print times
        run: nix develop --command npm run estimate:prints -- --published
        timeout-minutes: 35
        continue-on-error: true

      - name: Build site
        run: nix develop --command npm run build -w @3d-gallery/gallery-app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/gallery-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
